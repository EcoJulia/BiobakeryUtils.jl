name: CI
on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
jobs:
  format:
    name: Runic formatting check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - run: julia --project=dev -e 'using Pkg; Pkg.instantiate()'
      - run: julia --project=dev -m Runic --check src/ test/
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1'
        os:
          - ubuntu-latest
          - macOS-latest
        arch:
          - x64
        include:
          - version: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - run: |
          julia --project=@. -e '
          using Pkg
          Pkg.add(PackageSpec(name="Microbiome", rev="main"))
          Pkg.instantiate()'
      - uses: julia-actions/julia-buildpkg@v1.7.0
      - uses: julia-actions/julia-runtest@v1.13.0
      - uses: julia-actions/julia-processcoverage@v1.2.2
        continue-on-error: true
      - uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          files: lcov.info
